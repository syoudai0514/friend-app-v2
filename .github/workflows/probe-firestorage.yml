name: probe-firestorage-rena

on:
  push:
    branches:
      - "poc/rena-tripo-glb"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all firestorage page chunks
        env:
          SHARE_URL: https://firestorage.ai/ja/f/-x0xltPUWqHH
        run: |
          set -euo pipefail
          curl -LfsS "$SHARE_URL" -o share.html
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          html = Path('share.html').read_text('utf-8', errors='ignore')
          srcs = re.findall(r'<script[^>]+src="([^"]+)"', html)
          print('scripts', len(srcs))
          chunks = []
          for i, src in enumerate(srcs):
              if not src.startswith('http'):
                  url = 'https://firestorage.ai' + src
              else:
                  url = src
              out = Path(f'chunk-{i}.js')
              subprocess.run(['curl','-LfsS',url,'-o',str(out)], check=True)
              data = out.read_text('utf-8', errors='ignore')
              chunks.append((url, data))
              print(i, len(data), url)
          needles = ['/api/', 'download', 'presign', 'signedurl', 'signed', 'shareid', 'share_id',
                     'publicid', 'public_id', 'fetch(', 'filename', 'file_name', 'expires', 'token']
          for url, text in chunks:
              low = text.lower()
              if not any(n in low for n in needles):
                  continue
              print('\n###', url)
              for needle in needles:
                  start = 0
                  hits = 0
                  while hits < 5:
                      i = low.find(needle, start)
                      if i < 0: break
                      print(f'\n-- {needle} --')
                      print(text[max(0,i-300):i+900])
                      start = i + len(needle)
                      hits += 1
              paths = sorted(set(re.findall(r'[\"\'](\/[^\"\']{2,220})[\"\']', text)))
              for p in paths:
                  pl = p.lower()
                  if any(k in pl for k in ['api','download','share','file']):
                      print('PATH', p)
          PY
