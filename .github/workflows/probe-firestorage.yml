name: probe-firestorage-rena

on:
  push:
    branches:
      - "poc/rena-tripo-glb"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage download implementation
        env:
          SHARE_URL: https://firestorage.ai/ja/f/-x0xltPUWqHH
          CHUNK_URL: https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js
        run: |
          set -euo pipefail
          curl -LfsS "$SHARE_URL" -o share.html
          curl -LfsS "$CHUNK_URL" -o page.js
          echo '=== chunk size ==='
          wc -c page.js
          echo '=== endpoint/string candidates ==='
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('page.js').read_text('utf-8', errors='ignore')
          # Print small windows around useful tokens rather than the whole minified bundle.
          needles = [
              '/api/', 'download', 'presign', 'signed', 'shareId', 'share_id',
              'publicId', 'public_id', 'fetch(', 'axios', 'fileName', 'filename',
              'folder', 'object', 'token', 'expires'
          ]
          for needle in needles:
              print(f'\n=== {needle} ===')
              start = 0
              hits = 0
              low = text.lower()
              nlow = needle.lower()
              while hits < 12:
                  i = low.find(nlow, start)
                  if i < 0:
                      break
                  print(text[max(0, i-350):i+900])
                  print('\n---')
                  start = i + max(1, len(needle))
                  hits += 1
          print('\n=== quoted path candidates ===')
          paths = sorted(set(re.findall(r'[\"\'](\/[^\"\']{2,180})[\"\']', text)))
          for p in paths:
              low = p.lower()
              if any(k in low for k in ['api', 'download', 'share', 'file', 'folder']):
                  print(p)
          PY
