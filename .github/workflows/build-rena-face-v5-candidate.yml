name: build-rena-face-v5-candidate

on:
  push:
    branches:
      - "fix/rena-face-system-v5"
    paths:
      - ".github/workflows/build-rena-face-v5-candidate.yml"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh tools
        run: pip install --quiet trimesh pillow numpy matplotlib
      - name: Build seam-safe candidate and QA previews
        run: |
          python - <<'PY'
          import os, json, hashlib
          import numpy as np
          import trimesh
          from PIL import Image, ImageFilter
          import matplotlib.pyplot as plt

          SRC='public/models/rena/loose.glb'
          OUT='rena-v5-candidate.glb'
          QA='rena-v5-candidate-qa'
          os.makedirs(QA,exist_ok=True)
          scene=trimesh.load(SRC,force='scene')
          body=scene.geometry['RenaBody'].copy()
          head=scene.geometry['RenaHead'].copy()

          def colors(mesh):
            uv=mesh.visual.uv
            tex=np.asarray(mesh.visual.material.baseColorTexture.convert('RGB'))
            h,w=tex.shape[:2]
            px=np.clip((uv[:,0]*(w-1)).astype(np.int32),0,w-1)
            py=np.clip(((1-uv[:,1])*(h-1)).astype(np.int32),0,h-1)
            return tex[py,px]

          def skin_mask(c):
            c=c.astype(np.int16)
            return ((c[:,0]>155)&(c[:,1]>80)&(c[:,2]>70)&
                    ((c[:,0]-c[:,1])>7)&((c[:,0]-c[:,2])>8)&
                    ((c[:,0]-c[:,1])<105)&((c[:,0]-c[:,2])<125))

          bc=colors(body); hc=colors(head)
          bs=skin_mask(bc); hs=skin_mask(hc)
          before_head=head.vertices.copy()

          # 1) Correct the whole replacement head a few mm posterior. The current
          # side view is slightly ahead of the body's neck axis. Blend the lower
          # neck back to the body below so the correction never creates a new seam.
          head.vertices[:,2] -= 0.0030

          # 2) Further soften only the central lower face. v4 already improved it;
          # v5 adds a conservative refinement to remove the remaining pointed/
          # protruding chin without touching nose, eyes, hair or earrings.
          v=head.vertices
          x,y,z=v[:,0],v[:,1],v[:,2]
          wy=np.zeros(len(v),dtype=np.float64)
          m=(y>=0.831)&(y<0.839); wy[m]=(y[m]-0.831)/0.008
          m=(y>=0.839)&(y<=0.851); wy[m]=1.0
          m=(y>0.851)&(y<=0.859); wy[m]=1.0-0.45*((y[m]-0.851)/0.008)
          m=(y>0.859)&(y<=0.871); wy[m]=0.55*(1.0-(y[m]-0.859)/0.012)
          wz=np.clip((z-0.001)/0.050,0.0,1.0)
          wx=np.clip((0.057-np.abs(x))/0.043,0.0,1.0)
          jaww=wy*wz*wx*hs.astype(np.float64)
          v[:,2] -= 0.0030*jaww
          v[:,1] += 0.0008*jaww
          taper=np.clip((0.858-y)/0.027,0.0,1.0)*wz*np.clip((0.060-np.abs(x))/0.048,0.0,1.0)*hs
          v[:,0] *= (1.0-0.020*taper)

          # 3) Measure the original body neck axis from the CURRENT approved body.
          bv=body.vertices
          body_ref=bs&(bv[:,1]>=0.837)&(bv[:,1]<=0.848)&(np.abs(bv[:,0])<0.050)
          head_ref=hs&(v[:,1]>=0.837)&(v[:,1]<=0.850)&(np.abs(v[:,0])<0.050)
          if body_ref.sum()<500 or head_ref.sum()<500:
            raise SystemExit(f'neck reference too small body={body_ref.sum()} head={head_ref.sum()}')
          def robust_frame(p):
            cx=float(np.median(p[:,0])); cz=float(np.median(p[:,2]))
            rx=float(np.percentile(np.abs(p[:,0]-cx),90))
            rz_lo=float(np.percentile(p[:,2]-cz,8)); rz_hi=float(np.percentile(p[:,2]-cz,92))
            return cx,cz,rx,rz_lo,rz_hi
          bf=robust_frame(bv[body_ref]); hf=robust_frame(v[head_ref])
          # Limit scaling so only genuine alignment correction is applied.
          sx=np.clip(bf[2]/max(hf[2],1e-6),0.90,1.10)
          sz_front=np.clip(bf[4]/max(hf[4],1e-6),0.90,1.10) if hf[4]>0 else 1.0
          sz_back=np.clip(bf[3]/min(hf[3],-1e-6),0.90,1.10) if hf[3]<0 else 1.0

          neck=hs&(y>=0.833)&(y<=0.862)&(np.abs(x)<0.052)
          blend=np.clip((0.862-y)/0.029,0.0,1.0)*neck.astype(np.float64)
          # At the bottom, converge to body neck center/width. Fade to zero by y=.862.
          target_x=bf[0]+(x-hf[0])*sx
          dz=z-hf[1]
          zscale=np.where(dz>=0,sz_front,sz_back)
          target_z=bf[1]+dz*zscale
          v[:,0]=x*(1-blend)+target_x*blend
          v[:,2]=z*(1-blend)+target_z*blend
          head.vertices=v

          # 4) Remove the overlap that caused the visible rectangular neck patch.
          # Keep the approved body/clothes intact; only skin faces above the collar
          # transition are removed. Keep hair/earrings from the replacement head.
          bfaces=body.faces
          bcent=body.vertices[bfaces].mean(axis=1)
          bskin=(bs[bfaces].sum(axis=1)>=2)
          remove_body=(bcent[:,1]>0.8435)&bskin
          body.update_faces(~remove_body)
          body.remove_unreferenced_vertices()

          # Recompute head colors/mask after geometry-only edits (UV unchanged).
          hc=colors(head); hs=skin_mask(hc)
          hfaces=head.faces
          hcent=head.vertices[hfaces].mean(axis=1)
          hskin=(hs[hfaces].sum(axis=1)>=2)
          central=np.abs(hcent[:,0])<0.050
          remove_head=(hcent[:,1]<0.8375)&hskin&central
          head.update_faces(~remove_head)
          head.remove_unreferenced_vertices()

          # 5) Match PBR response and lower-neck skin color to the approved body.
          bm=body.visual.material; hm=head.visual.material
          for attr in ('roughnessFactor','metallicFactor'):
            if hasattr(bm,attr) and hasattr(hm,attr):
              try: setattr(hm,attr,getattr(bm,attr))
              except Exception: pass

          # Texture-space skin correction, limited to the replacement neck region.
          # Use multiplicative channel ratios to preserve baked detail/shading.
          bc2=colors(body); bs2=skin_mask(bc2); bv2=body.vertices
          target_sel=bs2&(bv2[:,1]>=0.833)&(bv2[:,1]<=0.8435)&(np.abs(bv2[:,0])<0.047)
          target=np.median(bc2[target_sel],axis=0)
          hv=head.vertices; hc2=colors(head); hs2=skin_mask(hc2)
          neck_sel=hs2&(hv[:,1]>=0.8375)&(hv[:,1]<=0.862)&(np.abs(hv[:,0])<0.050)
          source=np.median(hc2[neck_sel],axis=0)
          ratio=np.clip(target/np.maximum(source,1.0),0.80,1.22)
          tex=np.asarray(head.visual.material.baseColorTexture.convert('RGB')).copy()
          H,W=tex.shape[:2]
          uv=head.visual.uv[neck_sel]
          px=np.clip((uv[:,0]*(W-1)).astype(np.int32),0,W-1)
          py=np.clip(((1-uv[:,1])*(H-1)).astype(np.int32),0,H-1)
          mask=np.zeros((H,W),dtype=np.uint8); mask[py,px]=255
          mask=Image.fromarray(mask).filter(ImageFilter.MaxFilter(15)).filter(ImageFilter.GaussianBlur(5))
          alpha=np.asarray(mask,dtype=np.float32)[...,None]/255.0
          corrected=np.clip(tex.astype(np.float32)*ratio[None,None,:],0,255)
          tex=(tex*(1-alpha)+corrected*alpha).astype(np.uint8)
          head.visual.material.baseColorTexture=Image.fromarray(tex,'RGB')

          # Recalculate normals after local deformation/cropping.
          body.fix_normals(); head.fix_normals()

          out_scene=trimesh.Scene()
          out_scene.add_geometry(body,geom_name='RenaBody',node_name='RenaBody')
          out_scene.add_geometry(head,geom_name='RenaHead',node_name='RenaHead')
          out_scene.export(OUT)
          check=trimesh.load(OUT,force='scene')
          if set(check.geometry.keys()) != {'RenaBody','RenaHead'}:
            raise SystemExit(f'unexpected geometry names {list(check.geometry)}')
          if check.bounds[0,1] < -1e-5 or check.bounds[1,1] > 1.01:
            raise SystemExit(f'bad bounds {check.bounds}')

          report={
            'source_sha256':hashlib.sha256(open(SRC,'rb').read()).hexdigest(),
            'candidate_sha256':hashlib.sha256(open(OUT,'rb').read()).hexdigest(),
            'source_bytes':os.path.getsize(SRC),'candidate_bytes':os.path.getsize(OUT),
            'body_frame':bf,'head_frame_before_neck_fit':hf,
            'neck_scale_x':float(sx),'neck_scale_front_z':float(sz_front),'neck_scale_back_z':float(sz_back),
            'body_faces_removed':int(remove_body.sum()),'head_faces_removed':int(remove_head.sum()),
            'neck_target_rgb':target.tolist(),'neck_source_rgb':source.tolist(),'neck_rgb_ratio':ratio.tolist(),
            'head_max_displacement_m':float(np.linalg.norm(head.vertices[:min(len(head.vertices),len(before_head))]-before_head[:min(len(head.vertices),len(before_head))],axis=1).max()) if len(head.vertices) else None,
            'final_bounds':check.bounds.tolist(),
            'geometries':{n:{'verts':len(g.vertices),'faces':len(g.faces),'bounds':g.bounds.tolist()} for n,g in check.geometry.items()}
          }
          with open(f'{QA}/report.json','w') as f: json.dump(report,f,indent=2)

          # Dense textured vertex preview for front/profile/back QA.
          rng=np.random.default_rng(20260907); P=[]; C=[]
          for n,g in check.geometry.items():
            k=min(len(g.vertices),320000); ids=rng.choice(len(g.vertices),k,replace=False)
            p=g.vertices[ids]
            try:
              uv=g.visual.uv[ids]; t=np.asarray(g.visual.material.baseColorTexture.convert('RGB')); hh,ww=t.shape[:2]
              xx=np.clip((uv[:,0]*(ww-1)).astype(np.int32),0,ww-1); yy=np.clip(((1-uv[:,1])*(hh-1)).astype(np.int32),0,hh-1)
              c=t[yy,xx]/255.0
            except Exception: c=np.full((k,3),0.6)
            P.append(p);C.append(c)
          p=np.concatenate(P); c=np.concatenate(C); keep=p[:,1]>.735; p=p[keep];c=c[keep]
          for label,horiz,depth in [('front',p[:,0],p[:,2]),('back',-p[:,0],-p[:,2]),('left',p[:,2],-p[:,0]),('right',-p[:,2],p[:,0])]:
            order=np.argsort(depth)
            plt.figure(figsize=(8,8));plt.scatter(horiz[order],p[:,1][order],s=.22,c=c[order],marker='.',linewidths=0)
            plt.xlim(-.18,.18);plt.ylim(.735,1.005);plt.axis('off');plt.tight_layout(pad=0)
            plt.savefig(f'{QA}/{label}.png',dpi=180,facecolor='white');plt.close()
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rena-v5-candidate-qa
          path: rena-v5-candidate-qa/
          retention-days: 2
