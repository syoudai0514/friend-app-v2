name: inspect-rena-face-v5

on:
  push:
    branches:
      - "fix/rena-face-system-v5"

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip-rena-inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh inspection tools
        run: pip install --quiet trimesh pillow numpy matplotlib
      - name: Inspect CURRENT composite
        run: |
          python - <<'PY'
          import os, json, hashlib
          import numpy as np
          import trimesh
          import matplotlib.pyplot as plt

          path='public/models/rena/loose.glb'
          scene=trimesh.load(path, force='scene')
          os.makedirs('rena-v5-inspect', exist_ok=True)
          report={
            'bytes': os.path.getsize(path),
            'sha256': hashlib.sha256(open(path,'rb').read()).hexdigest(),
            'scene_bounds': scene.bounds.tolist(),
            'geometry': []
          }
          all_pts=[]; all_cols=[]; all_geom=[]
          rng=np.random.default_rng(20260907)
          for gi,(name,g) in enumerate(scene.geometry.items()):
            info={'name':name,'verts':len(g.vertices),'faces':len(g.faces),'bounds':g.bounds.tolist()}
            mat=getattr(g.visual,'material',None)
            info['material_type']=type(mat).__name__ if mat is not None else None
            if mat is not None:
              f=getattr(mat,'baseColorFactor',None)
              info['baseColorFactor']=list(f) if f is not None else None
              tex=getattr(mat,'baseColorTexture',None)
              if tex is not None:
                info['texture_size']=list(tex.size)
            bands=[]
            for lo,hi in [(0.74,0.77),(0.77,0.80),(0.80,0.83),(0.83,0.86),(0.86,0.89),(0.89,0.92),(0.92,0.96),(0.96,1.01)]:
              m=(g.vertices[:,1]>=lo)&(g.vertices[:,1]<hi)
              if m.any():
                p=g.vertices[m]
                bands.append({'y':[lo,hi],'n':int(m.sum()),'x':[float(p[:,0].min()),float(p[:,0].max())],'z':[float(p[:,2].min()),float(p[:,2].max())]})
            info['bands']=bands
            report['geometry'].append(info)

            n=min(len(g.vertices),280000)
            ids=rng.choice(len(g.vertices),n,replace=False)
            pts=g.vertices[ids]
            try:
              uv=g.visual.uv[ids]
              tex=np.asarray(g.visual.material.baseColorTexture.convert('RGB'))
              h,w=tex.shape[:2]
              px=np.clip((uv[:,0]*(w-1)).astype(np.int32),0,w-1)
              py=np.clip(((1-uv[:,1])*(h-1)).astype(np.int32),0,h-1)
              cols=tex[py,px]/255.0
            except Exception:
              cols=np.full((n,3),0.6)
            all_pts.append(pts); all_cols.append(cols); all_geom.append(np.full(n,gi))

          with open('rena-v5-inspect/report.json','w') as f: json.dump(report,f,indent=2)
          pts=np.concatenate(all_pts); cols=np.concatenate(all_cols); gids=np.concatenate(all_geom)
          crop=pts[:,1]>0.735
          pts=pts[crop]; cols=cols[crop]; gids=gids[crop]
          views=[
            ('front',pts[:,0],pts[:,1],pts[:,2]),
            ('back',-pts[:,0],pts[:,1],-pts[:,2]),
            ('left',pts[:,2],pts[:,1],-pts[:,0]),
            ('right',-pts[:,2],pts[:,1],pts[:,0]),
          ]
          for label,h,v,depth in views:
            order=np.argsort(depth)
            plt.figure(figsize=(8,8))
            plt.scatter(h[order],v[order],s=0.20,c=cols[order],marker='.',linewidths=0)
            plt.xlim(-0.18,0.18); plt.ylim(0.735,1.005); plt.axis('off'); plt.tight_layout(pad=0)
            plt.savefig(f'rena-v5-inspect/{label}.png',dpi=180,facecolor='white'); plt.close()
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rena-v5-inspect
          path: rena-v5-inspect/
          retention-days: 2
