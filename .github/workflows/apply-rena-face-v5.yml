name: apply-rena-face-v5

on:
  push:
    branches:
      - "fix/rena-face-system-v5"
    paths:
      - ".github/workflows/apply-rena-face-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh tools
        run: pip install --quiet trimesh pillow numpy matplotlib scipy
      - name: Rebuild validated candidate from CURRENT source
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-rena-face-v5-candidate.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("          PY\n",start)
          lines=src[start:end].splitlines()
          Path('/tmp/rena_v5_candidate.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          PY
          python /tmp/rena_v5_candidate.py
      - name: Verify and install asset
        run: |
          set -euo pipefail
          EXPECTED_SOURCE=bfb42e47ce18f55678cc3a1c0de4a50257c634473a85c189fc8e5b212e52f925
          EXPECTED_CANDIDATE=31d5a06ef664d268c3e35235ea233350f1988e2e9a38c191eb27513f8149d93d
          SOURCE_SHA=$(sha256sum public/models/rena/loose.glb | awk '{print $1}')
          CANDIDATE_SHA=$(sha256sum rena-v5-candidate.glb | awk '{print $1}')
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE"
          test "$CANDIDATE_SHA" = "$EXPECTED_CANDIDATE"
          mv rena-v5-candidate.glb public/models/rena/loose.glb
          test "$(head -c 4 public/models/rena/loose.glb)" = "glTF"
      - name: Commit asset and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/inspect-rena-face-v5.yml \
            .github/workflows/build-rena-face-v5-candidate.yml \
            .github/workflows/rerun-rena-face-v5-candidate.yml \
            .github/workflows/rerun2-rena-face-v5-candidate.yml \
            .github/workflows/apply-rena-face-v5.yml
          git add public/models/rena/loose.glb .github/workflows/
          git commit -m 'fix: eliminate Rena neck seam and refine face [rena-v5-asset]'
          git push origin HEAD:fix/rena-face-system-v5
