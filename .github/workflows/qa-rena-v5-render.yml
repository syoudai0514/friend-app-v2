name: qa-rena-v5-render

on:
  push:
    branches:
      - "fix/rena-face-system-v5"
    paths:
      - ".github/workflows/qa-rena-v5-render.yml"

permissions:
  contents: read

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev > /tmp/rena-v5-dev.log 2>&1 &
          echo $! > /tmp/rena-v5-dev.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rena-v5-dev.log
          exit 1
      - name: Render actual app front/side/back views
        run: |
          mkdir -p rena-v5-app-qa
          cat > /tmp/rena-v5-render.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--use-angle=swiftshader',
                '--disable-dev-shm-usage',
                '--js-flags=--max-old-space-size=4096',
              ],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
            });
            const state = {
              schemaVersion: 2,
              onboarded: true,
              userName: 'QA',
              persona: {
                id: 'rena',
                name: 'れな',
                firstPerson: '私',
                honorific: 'くん',
                speech: '落ち着いた大人の話し方。',
                personality: '面倒見のいい年上の恋人。',
                idleLines: ['おかえりなさい、QAくん。今日はどうだった？'],
              },
              look: { variantId: 'default', scene: 'night', motionId: 'idle' },
              affection: 65,
              messages: [],
              memories: [],
              personas: {},
              voice: { enabled: false, autoplay: false },
            };
            await context.addInitScript((payload) => {
              localStorage.setItem('friend-app:v2', JSON.stringify(payload));
            }, state);

            const page = await context.newPage();
            const events = [];
            page.on('console', m => {
              if (['error','warning'].includes(m.type())) events.push(`console.${m.type()}: ${m.text()}`);
            });
            page.on('pageerror', e => events.push(`pageerror: ${e.stack || e.message}`));
            page.on('requestfailed', r => events.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText}`));

            const response = await page.goto('http://127.0.0.1:3000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || !response.ok()) throw new Error(`Home response not OK: ${response?.status()}`);
            await page.getByRole('button', { name: '表示位置を戻す' }).waitFor({ state: 'visible', timeout: 120000 });
            await page.waitForTimeout(4000);
            if (await page.getByText('読み込めませんでした').count()) throw new Error('Rena model load fallback/error is visible');

            const canvas = page.locator('canvas').first();
            await canvas.waitFor({ state: 'visible' });
            const box = await canvas.boundingBox();
            if (!box) throw new Error('Canvas has no bounding box');
            const center = { x: box.x + box.width / 2, y: box.y + box.height / 2 };

            const shot = async (name) => {
              await page.waitForTimeout(1000);
              await page.screenshot({ path: `rena-v5-app-qa/${name}.png`, fullPage: true });
            };
            const orbit = async (dx) => {
              await page.mouse.move(center.x, center.y);
              await page.mouse.down();
              await page.mouse.move(center.x + dx, center.y, { steps: 35 });
              await page.mouse.up();
              await page.waitForTimeout(600);
            };

            await shot('01-front-full');
            await page.mouse.move(center.x, center.y);
            await page.mouse.wheel(0, -1500);
            await page.waitForTimeout(1200);
            await shot('02-front-close');
            await orbit(-205);
            await shot('03-yaw-90');
            await orbit(-205);
            await shot('04-yaw-180');
            await orbit(-205);
            await shot('05-yaw-270');
            await orbit(-205);
            await shot('06-front-return');

            const canvasInfo = await canvas.evaluate(el => ({ width: el.width, height: el.height, clientWidth: el.clientWidth, clientHeight: el.clientHeight }));
            fs.writeFileSync('rena-v5-app-qa/runtime.json', JSON.stringify({
              url: page.url(),
              title: await page.title(),
              canvas: canvasInfo,
              fallbackVisible: false,
              events,
            }, null, 2));
            await browser.close();
          })().catch(err => {
            fs.writeFileSync('rena-v5-app-qa/failure.txt', String(err && (err.stack || err)));
            console.error(err);
            process.exit(1);
          });
          JS
          node /tmp/rena-v5-render.cjs
      - name: Capture dev log
        if: always()
        run: cp /tmp/rena-v5-dev.log rena-v5-app-qa/dev.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rena-v5-actual-app-qa
          path: rena-v5-app-qa/
          retention-days: 3
