name: refine-rena-face-once

on:
  push:
    branches:
      - "fix/rena-ideal-face-v4"

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[rena-face-v4]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: pip install --quiet trimesh pillow numpy matplotlib

      - name: Refine lower face toward ideal profile
        run: |
          python - <<'PY'
          import os, hashlib
          import numpy as np
          import trimesh
          from PIL import Image
          import matplotlib.pyplot as plt

          path = 'public/models/rena/loose.glb'
          scene = trimesh.load(path, force='scene')
          print('geometry_count', len(scene.geometry))
          for name, g in scene.geometry.items():
              print('GEOM', name, 'verts', len(g.vertices), 'faces', len(g.faces), 'bounds', g.bounds.tolist())

          # The composite has the body down to y=0 and a separate replacement head/neck
          # whose geometry starts around the collar. Pick the latter deterministically.
          candidates = [(name, g) for name, g in scene.geometry.items() if g.bounds[0, 1] > 0.75]
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one head geometry, found {[(n, gg.bounds.tolist()) for n, gg in candidates]}')
          head_name, head = candidates[0]
          v = head.vertices.copy()
          before = v.copy()

          # Texture-aware mask so hair/earrings are not deformed with the jaw.
          skin_or_lip = np.ones(len(v), dtype=bool)
          try:
              uv = head.visual.uv
              tex = np.asarray(head.visual.material.baseColorTexture.convert('RGB'))
              h, w = tex.shape[:2]
              px = np.clip((uv[:, 0] * (w - 1)).astype(np.int32), 0, w - 1)
              py = np.clip(((1.0 - uv[:, 1]) * (h - 1)).astype(np.int32), 0, h - 1)
              c = tex[py, px].astype(np.int16)
              skin = (
                  (c[:, 0] > 165) & (c[:, 1] > 85) & (c[:, 2] > 75) &
                  ((c[:, 0] - c[:, 1]) > 5) & ((c[:, 0] - c[:, 2]) > 7)
              )
              lip = (
                  (c[:, 0] > 115) & ((c[:, 0] - c[:, 1]) > 18) &
                  ((c[:, 0] - c[:, 2]) > 8) & (c[:, 1] > 45)
              )
              skin_or_lip = skin | lip
              print('skin_or_lip_vertices', int(skin_or_lip.sum()), '/', len(v))
          except Exception as e:
              print('texture mask fallback:', repr(e))

          x, y, z = v[:, 0], v[:, 1], v[:, 2]

          # Lower-face vertical weight. Strongest at chin / mandibular projection,
          # tapering smoothly through lower lip. Nose/eyes/forehead stay untouched.
          wy = np.zeros(len(v), dtype=np.float64)
          m = (y >= 0.830) & (y < 0.838)
          wy[m] = (y[m] - 0.830) / 0.008
          m = (y >= 0.838) & (y <= 0.850)
          wy[m] = 1.0
          m = (y > 0.850) & (y <= 0.858)
          wy[m] = 1.0 - 0.35 * ((y[m] - 0.850) / 0.008)
          m = (y > 0.858) & (y <= 0.872)
          wy[m] = 0.65 * (1.0 - (y[m] - 0.858) / 0.014)

          # Front/center weighting: preserve rear skull, ears, hair and neck.
          wz = np.clip((z - 0.006) / 0.050, 0.0, 1.0)
          wx = np.clip((0.060 - np.abs(x)) / 0.045, 0.0, 1.0)
          wgt = wy * wz * wx * skin_or_lip.astype(np.float64)

          # Target: the supplied ideal profile has a softer, slightly recessed chin.
          # Max ~6.5 mm posterior correction; ~1.3 mm shorter chin vertically.
          v[:, 2] -= 0.0065 * wgt
          v[:, 1] += 0.0013 * wgt

          # Subtle V-line taper on the lower jaw, without changing eyes/nose/hair.
          jaw = np.zeros(len(v), dtype=np.float64)
          m = (y >= 0.830) & (y <= 0.858)
          jaw[m] = np.clip((0.858 - y[m]) / 0.028, 0.0, 1.0)
          jaw *= np.clip((z - 0.002) / 0.052, 0.0, 1.0)
          jaw *= np.clip((0.064 - np.abs(x)) / 0.050, 0.0, 1.0)
          jaw *= skin_or_lip.astype(np.float64)
          v[:, 0] *= (1.0 - 0.045 * jaw)

          head.vertices = v

          moved = np.linalg.norm(v - before, axis=1)
          print('moved_vertices', int((moved > 1e-7).sum()))
          print('max_displacement_m', float(moved.max()))
          print('mean_moved_displacement_m', float(moved[moved > 1e-7].mean()) if np.any(moved > 1e-7) else 0.0)

          # Export with original two materials/textures preserved.
          tmp = path + '.tmp.glb'
          scene.export(tmp)
          check = trimesh.load(tmp, force='scene')
          if len(check.geometry) != len(scene.geometry):
              raise SystemExit('Geometry count changed unexpectedly')
          if check.bounds[0,1] < -1e-5 or check.bounds[1,1] > 1.01:
              raise SystemExit(f'Unexpected bounds after export: {check.bounds}')
          os.replace(tmp, path)

          # Lightweight visual QA artifacts from textured vertex samples.
          os.makedirs('rena-face-v4-preview', exist_ok=True)
          rng = np.random.default_rng(42)
          all_pts=[]; all_cols=[]
          for name, g in check.geometry.items():
              n=min(len(g.vertices), 220000)
              ids=rng.choice(len(g.vertices), size=n, replace=False)
              pts=g.vertices[ids]
              try:
                  uv=g.visual.uv[ids]
                  tex=np.asarray(g.visual.material.baseColorTexture.convert('RGB'))
                  hh,ww=tex.shape[:2]
                  pxx=np.clip((uv[:,0]*(ww-1)).astype(np.int32),0,ww-1)
                  pyy=np.clip(((1-uv[:,1])*(hh-1)).astype(np.int32),0,hh-1)
                  cols=tex[pyy,pxx]/255.0
              except Exception:
                  cols=np.full((n,3),0.55)
              all_pts.append(pts); all_cols.append(cols)
          pts=np.concatenate(all_pts); cols=np.concatenate(all_cols)
          # upper-body crop keeps face readable
          crop=pts[:,1] > 0.76
          pts=pts[crop]; cols=cols[crop]

          views=[
              ('front', pts[:,0], pts[:,1], (-0.13,0.13)),
              ('left',  pts[:,2], pts[:,1], (-0.11,0.09)),
              ('back', -pts[:,0], pts[:,1], (-0.13,0.13)),
          ]
          for label,horiz,vert,xlim in views:
              order=np.argsort(pts[:,2]) if label=='front' else np.arange(len(pts))
              plt.figure(figsize=(7,7))
              plt.scatter(horiz[order], vert[order], s=0.16, c=cols[order], marker='.', linewidths=0)
              plt.xlim(*xlim); plt.ylim(0.76,0.995); plt.axis('off'); plt.tight_layout(pad=0)
              plt.savefig(f'rena-face-v4-preview/{label}.png', dpi=180, facecolor='white')
              plt.close()

          size=os.path.getsize(path)
          h=hashlib.sha256()
          with open(path,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''):
                  h.update(chunk)
          print('final_bytes', size)
          print('final_sha256', h.hexdigest())
          PY

      - name: Upload visual QA previews
        uses: actions/upload-artifact@v4
        with:
          name: rena-face-v4-preview
          path: rena-face-v4-preview/
          retention-days: 1

      - name: Commit refined GLB and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refine-rena-face-once.yml
          git add public/models/rena/loose.glb .github/workflows/refine-rena-face-once.yml
          git commit -m 'fix: soften rena chin toward ideal profile [rena-face-v4]'
          git push origin HEAD:fix/rena-ideal-face-v4
