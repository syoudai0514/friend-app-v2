name: import-rena-hybrid-once

on:
  push:
    branches:
      - "poc/rena-hybrid-face-v1"

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[rena-hybrid-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and replace rena GLB
        env:
          API_BASE: https://api.firestorage.ai/prod/file
          SHARE_ID: 2QlzC0JKOYsN
          EXPECTED_SIZE: "102892304"
          EXPECTED_SHA256: 4f2f7f7bcc056f5500af2b627cb7d6ff9a8a4412b0073a1cf44d756ab630c006
        run: |
          set -euo pipefail
          TARGET='public/models/rena/loose.glb'

          curl -LfsS \
            -H 'Origin: https://firestorage.ai' \
            -H 'Referer: https://firestorage.ai/ja/f/2QlzC0JKOYsN' \
            "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" \
            -o files.json

          FILE_ID=$(python - <<'PY'
          import json
          data = json.load(open('files.json', encoding='utf-8'))
          files = data.get('files') or []
          if not files:
              raise SystemExit('No files returned by firestorage')
          preferred = [f for f in files if (f.get('fileName') or f.get('name')) == 'rena_hybrid_face_v1.glb']
          item = (preferred or files)[0]
          file_id = item.get('fileId') or item.get('id')
          if not file_id:
              raise SystemExit(f'No fileId in metadata keys: {sorted(item.keys())}')
          print(file_id)
          PY
          )
          echo "Resolved firestorage file id: $FILE_ID"

          curl -LfsS -X POST \
            -H 'Origin: https://firestorage.ai' \
            -H 'Referer: https://firestorage.ai/ja/f/2QlzC0JKOYsN' \
            "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" \
            -o download.json

          DOWNLOAD_URL=$(python - <<'PY'
          import json
          data = json.load(open('download.json', encoding='utf-8'))
          url = data.get('downloadUrl')
          if not url:
              raise SystemExit(f'No downloadUrl returned: {data}')
          print(url)
          PY
          )

          curl -LfsS "$DOWNLOAD_URL" -o "$TARGET"

          python - <<'PY'
          import hashlib, os, struct
          path = 'public/models/rena/loose.glb'
          expected_size = int(os.environ['EXPECTED_SIZE'])
          expected_sha = os.environ['EXPECTED_SHA256']
          size = os.path.getsize(path)
          with open(path, 'rb') as f:
              magic = f.read(4)
          h = hashlib.sha256()
          with open(path, 'rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          actual_sha = h.hexdigest()
          print('GLB bytes:', size)
          print('GLB sha256:', actual_sha)
          if magic != b'glTF':
              raise SystemExit(f'Invalid GLB magic: {magic!r}')
          if size != expected_size:
              raise SystemExit(f'Unexpected GLB size: {size} != {expected_size}')
          if actual_sha != expected_sha:
              raise SystemExit(f'Unexpected GLB sha256: {actual_sha} != {expected_sha}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'れなの顔差し替え統合GLBを反映 [rena-hybrid-import]'
          git push origin HEAD:poc/rena-hybrid-face-v1
