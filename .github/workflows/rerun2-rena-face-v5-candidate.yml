name: rerun2-rena-face-v5-candidate

on:
  push:
    branches:
      - "fix/rena-face-system-v5"
    paths:
      - ".github/workflows/rerun2-rena-face-v5-candidate.yml"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh tools
        run: pip install --quiet trimesh pillow numpy matplotlib
      - name: Extract and run candidate builder
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-rena-face-v5-candidate.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("          PY\n",start)
          lines=src[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          code=code.replace('body.fix_normals(); head.fix_normals()', '# normals are recomputed lazily by trimesh export')
          code=code.replace("'head_max_displacement_m':float(np.linalg.norm(head.vertices[:min(len(head.vertices),len(before_head))]-before_head[:min(len(head.vertices),len(before_head))],axis=1).max()) if len(head.vertices) else None,", "'head_max_displacement_m': None,")
          Path('/tmp/rena_v5_candidate.py').write_text(code)
          PY
          python /tmp/rena_v5_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: rena-v5-candidate-qa
          path: rena-v5-candidate-qa/
          retention-days: 2
